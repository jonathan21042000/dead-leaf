*{box-sizing:border-box}body{margin:0;background:#070907;color:#f0f4ed;font-family:Arial,sans-serif}
.wrap{max-width:1100px;margin:auto;padding:28px 18px 45px}
.hero{text-align:center;padding:20px 0 30px}
.logo{font-size:clamp(48px,9vw,90px);font-weight:1000;line-height:.78;letter-spacing:6px;color:#71ff39;text-shadow:0 0 8px #65ff35,0 0 28px #245f17}

.fire .name{font-family:Impact,Arial Black,sans-serif;color:#ffb62c;text-shadow:2px 2px #b6320d,0 0 14px #ff5b00}
.poison .name{font-family:Impact,Arial Black,sans-serif;color:#70e63b;text-shadow:2px 2px #173b10,0 0 10px #72ff38}
.mara .name{font-family:Georgia,serif;color:#d8b76b;text-shadow:1px 1px #493213}

.white .name{font-family:Arial Black,sans-serif;color:#f1f1ec;text-shadow:2px 2px #555}
dialog{width:min(680px,calc(100% - 28px));border:1px solid #70ff35;border-radius:20px;background:#0b0f0a;color:#f0f4ed;padding:0}
dialog::backdrop{background:#000b}
.modal{padding:22px}
.head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.close{background:transparent;border:0;color:white;font-size:30px;cursor:pointer;min-width:44px;min-height:44px}
.photo{width:100%;border-radius:15px;margin:14px 0;display:block;background:#111}
.photo img{width:100%;display:block;border-radius:15px}
.tag{color:#70ff35;font-weight:900;font-size:18px;margin-top:5px}
.desc{color:#b7c1b3;line-height:1.7;margin-top:8px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}

const grid=document.getElementById('grid'), dialog=document.getElementById('dialog');
products.forEach((p,i)=>{
 const b=document.createElement('button'); b.className='card '+p.style; b.type='button';
 b.innerHTML='<span class="name">'+p.name+'</span>';
 b.addEventListener('click',()=>{
  document.getElementById('title').textContent=p.name;
  document.getElementById('photo').src=p.image;
  document.getElementById('photo').alt='Fotografía de '+p.name;
  document.getElementById('tag').textContent=p.tag;
  document.getElementById('desc').textContent=p.desc;
  dialog.showModal();
 });
 grid.appendChild(b);
});
document.getElementById('close').addEventListener('click',()=>dialog.close());
dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});

</script>
